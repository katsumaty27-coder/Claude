name: Fetch Real Estate Data

on:
  # 毎月15日の日本時間9:00(UTC 0:00)に実行
  schedule:
    - cron: '0 0 15 * *'

  # 手動トリガー: Actions タブからの実行を有効化
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Fetch real estate data
        env:
          MLIT_API_KEY: ${{ secrets.MLIT_API_KEY }}
        run: |
          python scripts/fetch_real_estate_data.py

      - name: Commit and push data
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add data/

          # git diff --quiet は未追跡(新規)ファイルを検知しないため、
          # add した後に --staged で判定する
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: Fetch real estate data ($(date +'%Y-%m-%d'))"
            git push origin main
          fi

      - name: Report execution
        run: |
          echo "✓ Fetch completed at $(date)"
